name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # push tags, changelog commits
  issues: write # comment on issues
  pull-requests: write # comment on PRs
  id-token: write # needed for semantic-release to authenticate with npm registry via GitHub's OIDC token

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags (required to allow semantic-release to analyze commits)
      # Setup Node.js v18
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      # Install semantic-release plugins to determine the next version, update changelog, publish to npm, and create GitHub release
      # - semantic-release@23: The main semantic-release package
      # - @semantic-release/commit-analyzer@11: Analyze commits with Conventional Commits
      # - @semantic-release/release-notes-generator@12: Generate release notes
      # - @semantic-release/changelog@6: Update the changelog file
      # - @semantic-release/npm@11: Publish the package to npm
      # - @semantic-release/git@10: Commit changelog and version bump
      # - @semantic-release/github@10: Create GitHub releases
      - name: Install semantic-release (CI-only)
        run: |
          npm install \
            semantic-release@23 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12 \
            @semantic-release/changelog@6 \
            @semantic-release/npm@11 \
            @semantic-release/git@10 \
            @semantic-release/github@10
      # Run semantic-release to automate the release process
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Auto-provided by GitHub Actions, used to create releases
        run: npx semantic-release
